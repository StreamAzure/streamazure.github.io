name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.167.0
  THEME_REPO: https://github.com/StreamAzure/hugo-PaperMod.git
  THEME_REF: master
  THEMES_DIR: .github/build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # enableGitInfo 需要完整历史

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          set -euo pipefail
          echo "Installing Hugo ${HUGO_VERSION} (standard edition)..."
          curl -sfL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Get theme (your PaperMod fork)
        run: |
          set -euo pipefail
          # 站点的全部个性化（右侧目录栏 CSS、KaTeX 加载器、自托管 KaTeX）
          # 都在主题 fork 里，这里拉到什么就是什么，本站点仓库不再覆盖任何主题文件。
          git clone --depth 1 --branch "${THEME_REF}" "${THEME_REPO}" "${THEMES_DIR}/PaperMod"
          echo "theme commit: $(git -C "${THEMES_DIR}/PaperMod" rev-parse HEAD)"

      - name: Show layout (debug)
        run: |
          set -euo pipefail
          echo "--- repo root ---"; ls -la
          echo "--- notes count ---"; find notes -name '*.md' | wc -l
          echo "--- themes ---"; ls -la "${THEMES_DIR}"

      - name: Build
        run: |
          set -euo pipefail
          hugo build \
            --gc \
            --minify \
            --config hugo.yaml \
            --themesDir "${THEMES_DIR}" \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --logLevel info

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
