name: Preview (draft build, no deploy)

# 手动触发：在 GitHub 的 Actions 页面点 "Run workflow"
# 产出一个可下载的 artifact，包含草稿在内的完整站点，不会发布上线。

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.167.0
  THEME_REPO: https://github.com/StreamAzure/hugo-PaperMod.git
  THEME_REF: master
  THEMES_DIR: .github/build

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -sfL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Get theme (your PaperMod fork)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${THEME_REF}" "${THEME_REPO}" "${THEMES_DIR}/PaperMod"

      - name: Build with drafts
        run: |
          set -euo pipefail
          hugo build \
            --gc \
            --buildDrafts \
            --buildFuture \
            --config hugo.yaml \
            --themesDir "${THEMES_DIR}" \
            --baseURL "https://streamazure.github.io/" \
            --logLevel info

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: ./public
          retention-days: 7
