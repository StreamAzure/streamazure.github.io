# ============================================================
#  笔记站配置  ——  日常你只需要改动最上面这几行
#  构建在 GitHub Actions 里完成，本地不需要装 Hugo
#  改完先在本地验一遍（见 README「WSL 构建机」一节）再 push
# ============================================================

baseURL: "https://streamazure.github.io/"
title: "StreamAzure 的笔记"
theme: "PaperMod"

# 语言设置。languageCode/languageName 写在根上已弃用（Hugo 0.158 起），
# 移到 languages 段里用 locale/label。
languages:
  en:
    label: "简体中文"
    locale: "zh-cn"
    weight: 1

# 用 git 提交时间兜底 lastmod，笔记里不写 date 也不会报错
enableGitInfo: true
enableRobotsTXT: true
# 未来日期的笔记也照发。设为 false 时，date 晚于构建时刻的笔记会被整篇丢掉，
# 而"今天的日期"在 UTC 构建环境里常被算成未来。要"不发布"请用 draft: true。
buildFuture: true
# 中文分词，摘要长度才准确
hasCJKLanguage: true
pagination:
  pagerSize: 10

# 首页除了 HTML 还要输出 JSON —— 那是站内搜索用的索引（主题的 layouts/index.json）。
# 不声明这一项就不会生成 index.json，搜索页会一直转圈。
outputs:
  home:
    - HTML
    - RSS
    - JSON

# ---------- 分类 / 标签 ----------
# 只用分类，不要标签（标签对本站点不实用，已关闭）。
# 分类支持两级：front matter 写 categories: ["一级"] 或 ["一级/二级"]，
#   Hugo 只会为叶子术语生成页面（categories/一级/二级/），
#   父级聚合视图由主题的 layouts/_default/terms.html 现算，不需要额外字段。
taxonomies:
  category: categories

# ---------- 顶部导航菜单 ----------
# name = 显示文字，url = 站内路径，weight = 排序（越小越靠左）
menu:
  main:
    - name: "首页"
      url: "/"
      weight: 1
    - name: "分类"
      url: "/categories/"
      weight: 2
    - name: "归档"
      url: "/archives/"
      weight: 3
    - name: "搜索"
      url: "/search/"
      weight: 4

# ---------- 内容来源 ----------
# source 用相对路径，不要加前导斜杠（前导 / 会被当成绝对文件系统路径，
# 结果是构建不报错、但一篇文章都收不到）。
module:
  mounts:
    # 站点的"导航页"（归档、搜索）。只有下面 files 白名单里列出的文件会被读取。
    - source: content
      target: content
      files:
        - "_index.md"
        - "archives.md"
        - "search.md"
        - "categories/_index.md"   # 分类页的标题（不写就会显示英文 Categories）

    - source: notes
      # 挂进一个具名 section，页面的 Type 才会是 "notes"，
      # 从而和 params.mainSections 对上，首页才有文章列表。
      target: content/notes

      # ⚠️ 这里刻意不设 files 白名单。
      # 曾经设过 files: ["**.md", "**.png", ...] 想防误发，
      # 结果 "**" 在 Hugo 的挂载语义里**不跨目录** ——
      # 子目录里的文件一个都收不到（用 `hugo list all` 验证过），
      # 于是"一篇一目录"的页面包写法彻底失效，笔记配图也就没法用了。
      # 真正的守门人是 .gitignore：没被 commit 的文件根本不会进构建。
      excludeFiles:
        - "**/.obsidian/**"
        - "**/.trash/**"
        - "**/*.canvas"
        - "**/*.excalidraw"
        - "**/.DS_Store"
        - "**/Thumbs.db"

# ---------- Markdown 渲染 ----------
markup:
  goldmark:
    renderer:
      unsafe: true # 允许笔记里内嵌 HTML
    extensions:
      passthrough:
        enable: true # 数学公式交给 KaTeX 渲染
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
  highlight:
    noClasses: false
    lineNos: true
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

# ---------- 主题行为 ----------
params:
  env: production
  description: "随手记下的东西"
  author: "StreamAzure"

  # 首页文章列表靠这一项：PaperMod 首页的过滤条件是
  #   where site.RegularPages "Type" "in" site.Params.mainSections
  # 按页面的 Type（= 内容顶层目录名）匹配，所以必须和挂载目标 content/notes 一致。
  mainSections:
    - notes

  # 文章页目录。
  # 目录栏的样式在 .github/build/toc-sidebar.css，
  # KaTeX 注入在 .github/build/extend_head.html，
  # 两者都由 pages.yml 在构建前复制进主题（PaperMod 没有配置项可挂，只能用它的扩展点）。
  ShowToc: true
  TocOpen: true

  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowRssButtonInSectionTermList: true

  defaultTheme: auto

  # ---------- 首页介绍块 ----------
  # 纵向顺序：头像 → 小标题 → 自述 → 社交图标，整块居中。
  # 结构在主题 fork 的 layouts/_partials/home_info.html，
  # 布局在主题 fork 的 assets/css/extended/home-profile.css。
  #
  # avatar：绝对 URL 直接用；写站内路径就当静态文件（对应仓库里的 static/ 目录）
  # title ：小标题。顶部导航栏已经显示了站点名，这里不重复，所以不写
  # Content：自述，按 markdown 渲染。空行分段，一段一个 <p>。
  #          不写这一项时，首页直接显示上面 params.description 那句话。
  homeInfoParams:
    avatar: "/avatar.png"
    Content: |-
      做 LLM 推理引擎方向，日常围绕调度、KV Cache 与批处理这些层面读代码。
      这个站用来放读源码时的记录，一篇讲清一条链路。

      写得不全的地方欢迎到 GitHub 提 issue。

  # ---------- 社交图标 ----------
  # 显示在首页自述下方。可用的 name 由主题的 layouts/_partials/svg.html 定义。
  socialIcons:
    - name: "github"
      url: "https://github.com/StreamAzure"
    - name: "email"
      url: "mailto:1905105036@qq.com"
